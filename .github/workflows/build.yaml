name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format-check

      - name: Lint
        run: npm run lint

      - name: Build project
        run: npm run build-prod

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      # Step upload artifact HARUS berada di job build
      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Ganti './dist' jika folder output kamu berbeda (misal: './build' atau './out')
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Job deploy hanya bertugas menerima artifact dan mempublikasikannya
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
